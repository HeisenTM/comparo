<!DOCTYPE html>

<title>Comparo: higher or lower?</title>
<meta name="description" content="Comparo is a higher or lower game about countries, animals and planets.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">

<style>
:root{--bg:#ededed;--fg:#141414;--card:#ffffff;--cardfg:#141414;--chip:#ededed;--track:rgba(20,20,20,.16);--sheet:#fff;--edge:#d9d9d9;--ac:#2fbd6f}
:root[data-theme=dark]{--bg:#121212;--fg:#ededed;--card:#1c1c1c;--cardfg:#ededed;--track:rgba(255,255,255,.14);--sheet:#1a1a1a;--edge:#2e2e2e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter Tight',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
#app{height:100vh;height:100dvh;overflow:auto}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.btn{background:var(--chip);color:#141414;font-weight:700;font-size:1.05rem;padding:14px 26px;border-radius:14px;box-shadow:none;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.dk{background:var(--fg);color:var(--bg)}
.lnk{text-decoration:underline;font-weight:500;opacity:.7;padding:8px}
.ic{width:40px;height:40px;border-radius:50%;background:var(--track);display:grid;place-items:center;flex:none}
.tools{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:5}
.home{max-width:920px;margin:0 auto;padding:8vh 20px 40px;text-align:center}
.home h1{font-size:clamp(3rem,12vw,6.5rem);font-weight:700;letter-spacing:-.05em;line-height:.9}
.home h1 .dot{color:var(--ac)}
.home h1 i{font-style:normal;display:inline-block;transform:rotate(-6deg);background:var(--fg);color:var(--bg);padding:0 .12em;border-radius:.15em;margin-left:.05em}
.home>p{margin:18px auto 34px;font-size:1.15rem;max-width:30ch;opacity:.8}
.packs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.pack{background:var(--card);color:var(--cardfg);border:1.5px solid var(--edge);border-radius:22px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.pack:hover{transform:translateY(-3px);border-color:var(--ac)}
.pack:active{transform:translateY(0)}
.pack .tile{width:48px;height:48px;border-radius:14px;background:var(--ac);color:#141414;display:grid;place-items:center;margin-bottom:12px}
.pack b{font-size:1.7rem;letter-spacing:-.03em}.pack>span:not(.tile){font-weight:500;font-size:.95rem;opacity:.8}.pack em{font-style:normal;font-weight:700;margin-top:10px;font-size:.9rem;color:var(--ac)}
.si{display:block}
.foot{margin-top:30px;font-size:.78rem;opacity:.6;line-height:1.4}
.home>.foot{max-width:60ch;font-size:.78rem;margin:34px auto 0}
.game{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;font-weight:700}
.top .ttl{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .rt{display:flex;align-items:center;gap:6px}
.top button{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.top .ic{background:var(--track);color:var(--fg);font-size:1rem}
.top .sc{min-width:64px;text-align:right}
.prog{display:flex;gap:6px;padding:0 12px 6px}.prog i{flex:1;height:6px;border-radius:4px;background:var(--track);transition:background .3s}
.prog i.cur{background:var(--fg)}.prog i.ok{background:var(--ac)}.prog i.bad{background:#e5484d}
.hint{display:flex;align-items:center;justify-content:center;gap:12px;min-height:40px;padding:0 12px 8px;font-weight:700;font-size:1.05rem;text-align:center}
.hint u{text-decoration:none;background:var(--ac);color:#141414;padding:1px 10px;border-radius:8px}
.hint .btn{padding:7px 20px;font-size:1rem}
.stage{flex:1;margin:0 10px;border-radius:24px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--bg);position:relative;min-height:0}
.credits{padding:8px 12px calc(8px + env(safe-area-inset-bottom));text-align:center;font-size:.72rem;opacity:.6;font-weight:500;line-height:1.3}
.pn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;min-height:0;min-width:0;cursor:pointer;transition:background .35s,transform .26s,opacity .26s,filter .15s}
.pn.l,.pn.r{background:var(--card);color:var(--cardfg)}
.stage.done .pn{cursor:default}.stage:not(.done) .pn:hover{filter:brightness(1.12)}
.pn:focus-visible{outline:3px solid var(--ac);outline-offset:-10px}
.pn.good{background:var(--ac)!important;color:#141414!important}.pn.bad{background:#ef5a5f!important;color:#141414!important}
.stage.leave .pn{opacity:0;transform:translateX(-36px)}
.stage.enter .pn{animation:in .34s both}
@keyframes in{from{opacity:0;transform:translateX(36px)}}
.im{height:clamp(90px,22vh,190px);display:flex;align-items:center;justify-content:center;font-size:clamp(4rem,14vh,7.5rem);line-height:1;width:100%}
.im img{max-height:100%;max-width:70%;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);object-fit:contain}
.im.a img{height:100%;aspect-ratio:1;object-fit:cover;border-radius:50%}
.im svg{height:100%;width:auto;max-width:60%}
.name{font-size:clamp(1.3rem,3.6vw,2.3rem);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.val{font-size:clamp(2.2rem,7vw,4.6rem);font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-height:1.1em;line-height:1.1}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:var(--bg);color:var(--fg);display:grid;place-items:center;font-weight:700;z-index:2;box-shadow:0 3px 0 rgba(0,0,0,.3);font-size:1.1rem;pointer-events:none}
.intro,.res{max-width:640px;margin:0 auto;padding:9vh 20px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.intro{min-height:100vh;min-height:100dvh;justify-content:center;background:var(--bg);color:var(--fg);max-width:none}
.intro h1{font-size:clamp(2.6rem,10vw,5.5rem);font-weight:700;letter-spacing:-.05em;line-height:.95}
.intro .btn{background:var(--ac);color:#141414;margin-top:10px}
.res .big{font-size:clamp(4rem,18vw,8rem);font-weight:700;letter-spacing:-.06em;line-height:.9}
.res h2{font-size:1.6rem;letter-spacing:-.03em}
.bars{width:100%;display:grid;gap:8px;text-align:left}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-weight:700;font-size:.95rem}
.bar div{height:12px;border-radius:6px;background:var(--track);overflow:hidden}.bar div i{display:block;height:100%;background:var(--ac);border-radius:6px}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.res .btn{background:var(--ac);color:#141414}.res .btn.dk{background:var(--fg);color:var(--bg)}
.sheet{width:100%;text-align:left;margin-top:14px}
.sheet h3{margin:20px 0 8px;font-size:1.1rem;display:flex;justify-content:space-between}
.sheet li{list-style:none;display:flex;gap:12px;padding:10px 12px;border-radius:12px;background:var(--sheet);margin-bottom:6px;font-size:.95rem;line-height:1.3}
.sheet li .m{width:22px;flex:none}
.sheet li.ok .m{color:var(--ac)}.sheet li.bad .m{color:#e5484d}
.sheet small{display:block;opacity:.65;margin-top:2px}
@media(max-width:700px){
.stage{grid-template-columns:none;grid-template-rows:1fr 1fr}
.pn{gap:4px;padding:8px}.im{height:clamp(64px,15vh,120px);font-size:clamp(3rem,10vh,5rem)}
.stage.leave .pn{transform:translateY(-30px)}@keyframes in{from{opacity:0;transform:translateY(30px)}}
.val{font-size:clamp(2rem,10vw,3.2rem)}.btn{padding:12px 20px}.bar{grid-template-columns:96px 1fr 40px}
.hint{min-height:36px;font-size:.98rem}.top .ttl{font-size:.9rem}.top .sc{min-width:52px;font-size:.9rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  else if(k=='ok')[523,659,784].forEach((f,i)=>tone(f,i*.08,.2,'triangle'));
  else if(k=='bad'){tone(220,0,.18,'sawtooth',.09);tone(165,.14,.3,'sawtooth',.09)}
  else if(k=='win')[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.28,'triangle'));
  else if(k=='lose')[330,262,196].forEach((f,i)=>tone(f,i*.16,.32,'sine'));
 }catch(e){}
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-tool]');if(!b)return;
 if(b.dataset.tool=='sound'){set.sound=!set.sound;if(set.sound)snd('tap')}else{set.theme=set.theme=='dark'?'light':'dark';applyTheme()}
 saveSet();document.querySelectorAll('[data-tool]').forEach(x=>x.innerHTML=toolIcon(x.dataset.tool));b.blur();
});
let best={};try{best=JSON.parse(localStorage.getItem('comparo')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('comparo',JSON.stringify(best))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nf=v=>v>=100?Math.round(v).toLocaleString('en-US'):v<1e-4?'0':String(parseFloat(v.toPrecision(3)));
function fmt(s,v){let t;if(s.big){const a=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']].find(x=>v>=x[0]);t=a?parseFloat((v/a[0]).toPrecision(3))+a[1]:nf(v)}else t=nf(v);return(s.p||'')+t+(s.u||'')}
const flagEmoji=c=>String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0)));
const flagURL=id=>`https://flagcdn.com/w320/${id.toLowerCase()}.png`;
function count(list,s,done){
 cancelAnimationFrame(raf);
 if(rm){list.forEach(([e,v])=>e.textContent=fmt(s,v));done();return}
 const t0=performance.now(),D=1000;
 (function f(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,4);list.forEach(([el,v])=>el.textContent=fmt(s,v*e));if(p<1)raf=requestAnimationFrame(f);else{list.forEach(([el,v])=>el.textContent=fmt(s,v));done()}})(t0);
}
// builds 5 fresh pairs: never a near-tie (<5%), and 1-2 close calls (<=35% apart) mixed in with easier ones
const gapOf=(x,y,k)=>Math.abs(x.v[k]-y.v[k])/Math.max(x.v[k],y.v[k]);
const flip=p=>Math.random()<.5?p:[p[1],p[0]];
function pairs(pool,k){
 let best=null,bs=99;
 if(pool.length>=10)for(let a=0;a<400&&bs>0;a++){
  const q=shuf(pool),r=[];let ok=true;
  for(let i=0;i<5;i++){const x=q[2*i],y=q[2*i+1];if(gapOf(x,y,k)<.05){ok=false;break}r.push([x,y])}
  if(!ok)continue;
  const c=r.filter(p=>gapOf(p[0],p[1],k)<=.35).length,sc=c<1?1-c:c>2?c-2:0;
  if(sc<bs){bs=sc;best=r}
 }
 if(best)return shuf(best).map(flip);
 const r=[];
 for(let t=0;r.length<5&&t<2000;t++){const x=pool[Math.random()*pool.length|0],y=pool[Math.random()*pool.length|0];if(x!==y&&x.v[k]!==y.v[k]&&(t>800||gapOf(x,y,k)>=.05)&&!r.some(p=>p.includes(x)&&p.includes(y)))r.push(flip([x,y]))}
 return r;
}
const PH={};
function photo(t){return PH[t]||(PH[t]=fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t)).then(r=>r.ok?r.json():null).then(j=>j&&j.thumbnail?j.thumbnail.source:null).catch(()=>null))}
function prefetch(ch){ch.forEach(it=>{if(G.cat=='c')new Image().src=flagURL(it.id);else if(G.cat=='a')photo(it.wp).then(u=>{if(u)new Image().src=u})})}
function planetSVG(p){
 const id='g'+p.id,sun=p.id=='Sun';
 return `<svg viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="${id}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs>`
 +(sun?`<circle cx="100" cy="100" r="95" fill="${p.col}" opacity=".25"/>`:'')
 +(p.id=='Saturn'?`<ellipse cx="100" cy="100" rx="96" ry="22" fill="none" stroke="#a8916a" stroke-width="9" transform="rotate(-18 100 100)" opacity=".9"/>`:'')
 +`<circle cx="100" cy="100" r="${sun?74:66}" fill="${p.col}"/><circle cx="100" cy="100" r="${sun?74:66}" fill="url(#${id})"/></svg>`;
}
function fillImgs(){
 document.querySelectorAll('.im').forEach(el=>{
  const it=CATS[G.cat].data.find(x=>x.id===el.dataset.id);if(!it)return;
  if(G.cat=='c'){const i=new Image();i.alt='Flag of '+it.name;i.onerror=()=>{el.textContent=flagEmoji(it.id)};i.src=flagURL(it.id);el.appendChild(i)}
  else if(G.cat=='a'){el.textContent=it.em;photo(it.wp).then(u=>{if(!u||!el.isConnected||el.dataset.id!==it.id)return;const i=new Image();i.alt=it.name;i.onload=()=>{if(el.isConnected&&el.dataset.id===it.id){el.textContent='';el.appendChild(i)}};i.src=u})}
  else el.innerHTML=planetSVG(it);
 });
}

/* ---------- SCREENS ---------- */
function home(){
 cancelAnimationFrame(raf);st='home';G=null;
 app.innerHTML=`<div class="tools">${tools()}</div><main class="home"><h1>comparo<span class="dot">.</span></h1><p>Which one is bigger? Pick a pack and find out.</p><div class="packs">`
 +Object.entries(CATS).map(([k,c])=>`<button class="pack" data-c="${k}" style="--c:${c.col}"><span class="tile">${svg(c.i,26)}</span><b>${c.name}</b><span>${c.blurb}</span><em>${c.subs.length*5} rounds${best[k]!=null?`, best ${best[k]}/${c.subs.length*5}`:''}</em></button>`).join('')
 +`</div><p class="foot">Numbers are rounded and from recent years. Tourism uses 2019 figures.<br>${credit()}</p></main>`;
 app.querySelectorAll('.pack').forEach(b=>b.onclick=()=>{snd('tap');start(b.dataset.c)});
 app.scrollTop=0;
}
function start(cat){G={cat,si:0,r:0,score:0,recs:[],busy:false,go:false};intro()}
function intro(){
 st='intro';const c=CATS[G.cat],s=c.subs[G.si];
 G.s=s;G.r=0;G.ch=pairs(c.data.filter(x=>x.v[s.k]!=null),s.k);prefetch(G.ch.flat());
 app.innerHTML=`<div class="intro" style="--ac:${c.col}"><p>Set ${G.si+1} of ${c.subs.length}</p><h1>${s.t}</h1><p>5 rounds. Tap the one with the higher ${s.q}.</p><button class="btn" id="go">Start</button><button class="lnk" id="q">Quit</button></div>`;
 $('#go').onclick=()=>round(true);$('#q').onclick=quit;$('#go').focus();app.scrollTop=0;
}
function quit(){if(!G||confirm('Leave this run? Your progress will be lost.'))home()}
function round(first){
 st='round';const c=CATS[G.cat],s=G.s,[A,B]=G.ch[G.r];G.busy=false;G.go=false;
 const seg=Array.from({length:5},(_,i)=>{const r=G.recs.filter(x=>x.si==G.si)[i];return `<i class="${r?(r.ok?'ok':'bad'):i==G.r?'cur':''}"></i>`}).join('');
 const pn=(it,side)=>`<section class="pn ${side}" id="${side}" role="button" tabindex="0" aria-label="${it.name}"><div class="im ${G.cat}" data-id="${it.id}"></div><h2 class="name">${it.name}</h2><div class="val" id="${side}v"></div></section>`;
 app.innerHTML=`<div class="game" style="--ac:${c.col}"><div class="top"><button id="q" aria-label="Quit">${svg('x',18)}</button><span class="ttl">${c.name}: ${s.t}</span><span class="rt">${tools()}<span class="sc">Score ${G.score}</span></span></div><div class="prog">${seg}</div>
 <div class="hint" id="hint">Tap the one with the higher <u>${s.q}</u></div>
 <div class="stage ${first?'':'enter'}" id="stage">${pn(A,'l')}<div class="vs" id="vs">VS</div>${pn(B,'r')}</div><div class="credits">${credit()}</div></div>`;
 $('#q').onclick=quit;
 [['l',true],['r',false]].forEach(([id,left])=>{const el=$('#'+id);el.onclick=()=>guess(left);el.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();e.stopPropagation();guess(left)}}});
 fillImgs();
}
function guess(left){
 if(!G||G.busy||st!=='round')return;G.busy=true;const g=G,s=G.s,[A,B]=G.ch[G.r],a=A.v[s.k],b=B.v[s.k],ok=left?a>b:b>a;
 G.recs.push({si:G.si,s,A,B,pick:left?A:B,ok});if(ok)G.score++;snd(ok?'ok':'bad');
 const win=a>b?'l':'r',pick=left?'l':'r';
 $('#stage').classList.add('done');$('#'+win).classList.add('good');if(!ok)$('#'+pick).classList.add('bad');
 $('#vs').innerHTML=svg(ok?'check':'x',26);
 $('#hint').innerHTML=`${ok?'Correct!':'Not this time.'} <button class="btn dk" id="nx">Next</button>`;
 $('#nx').onclick=next;$('#nx').focus();
 count([[$('#lv'),a],[$('#rv'),b]],s,()=>{if(G===g)g.tm=setTimeout(()=>{if(G===g)next()},1400)});
}
function next(){
 if(!G||G.go||st!=='round'||!G.busy)return;const g=G;g.go=true;clearTimeout(g.tm);cancelAnimationFrame(raf);
 const [A,B]=g.ch[g.r];$('#lv').textContent=fmt(g.s,A.v[g.s.k]);$('#rv').textContent=fmt(g.s,B.v[g.s.k]);
 $('#stage').classList.add('leave');
 setTimeout(()=>{if(G!==g)return;const n=CATS[g.cat].subs.length;if(g.r<4){g.r++;round()}else if(g.si<n-1){g.si++;intro()}else result()},rm?0:260);
}
function result(){
 cancelAnimationFrame(raf);st='result';const c=CATS[G.cat],tot=c.subs.length*5,pct=G.score/tot;
 if(best[G.cat]==null||G.score>best[G.cat]){best[G.cat]=G.score;save()}
 snd(pct>=.5?'win':'lose');
 const per=c.subs.map((s,i)=>({s,n:G.recs.filter(r=>r.si==i&&r.ok).length}));
 const hi=Math.max(...per.map(x=>x.n)),lo=Math.min(...per.map(x=>x.n));
 const msg=pct>=.9?'Outstanding.':pct>=.7?'Sharp instincts.':pct>=.5?'Solid effort.':'Tough set. Try again!';
 const nextK=Object.keys(CATS)[(Object.keys(CATS).indexOf(G.cat)+1)%3];
 const gap=r=>{const a=r.A.v[r.s.k],b=r.B.v[r.s.k],x=Math.max(a,b)/Math.min(a,b);return x<1.1?`only ${Math.round((x-1)*100)}% apart`:`${x.toFixed(x<10?1:0)}× apart`};
 app.innerHTML=`<div class="res" style="--ac:${c.col}"><p>${c.name} done</p><div class="big">${G.score}/${tot}</div><h2>${msg}</h2>
 ${hi!=lo?`<p>Best at <b>${per.find(x=>x.n==hi).s.t}</b>, toughest was <b>${per.find(x=>x.n==lo).s.t}</b>.</p>`:''}
 <div class="bars">${per.map(x=>`<div class="bar"><span>${x.s.t}</span><div><i style="width:${x.n*20}%"></i></div><span>${x.n}/5</span></div>`).join('')}</div>
 <div class="acts"><button class="btn dk" id="again">Play again</button><button class="btn" id="nxt">Try ${CATS[nextK].name}</button><button class="btn" id="hm">Home</button><button class="btn" id="cp">Copy score</button></div>
 <div class="sheet">${c.subs.map((s,i)=>`<h3><span>${s.t}</span><span>${per[i].n}/5</span></h3><ul>`+G.recs.filter(r=>r.si==i).map(r=>`<li class="${r.ok?'ok':'bad'}"><span class="m">${svg(r.ok?'check':'x',20)}</span><div><b>${r.A.name}</b> ${fmt(s,r.A.v[s.k])} vs <b>${r.B.name}</b> ${fmt(s,r.B.v[s.k])}<small>You picked ${r.pick.name}, ${gap(r)}</small></div></li>`).join('')+'</ul>').join('')}</div><p class="foot">${credit()}</p></div>`;
 $('#again').onclick=()=>start(G.cat);
 $('#nxt').onclick=()=>start(nextK);$('#hm').onclick=home;
 $('#cp').onclick=async e=>{const t=`I scored ${G.score}/${tot} on Comparo ${c.name}. Can you beat it? ${location.href}`;try{await navigator.clipboard.writeText(t);e.target.textContent='Copied'}catch(x){prompt('Copy your score:',t)}};
 app.scrollTop=0;
}
document.addEventListener('keydown',e=>{
 if(!G||st!=='round'||e.metaKey||e.ctrlKey||e.repeat)return;
 const onBtn=e.target.tagName=='BUTTON'&&e.target.id!='nx';
 if(!G.busy){if(e.key=='ArrowLeft'||e.key=='ArrowUp'){e.preventDefault();guess(true)}else if(e.key=='ArrowRight'||e.key=='ArrowDown'){e.preventDefault();guess(false)}}
 else if((e.key=='Enter'||e.key==' ')&&!onBtn){e.preventDefault();next()}
});
home();
</script>
