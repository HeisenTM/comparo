*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter Tight',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
#app{height:100vh;height:100dvh;overflow:auto}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

.lnk{text-decoration:underline;font-weight:500;opacity:.7;padding:8px}

.home{max-width:1200px;margin:0 auto;padding:9vh 24px 40px;text-align:center}
.home h1{font-size:clamp(3rem,12vw,6.5rem);font-weight:700;letter-spacing:-.05em;line-height:.9}

.packs{display:grid;gap:20px;grid-template-columns:repeat(2,1fr)}
.pack{position:relative;overflow:hidden;min-height:260px;background:var(--pack);color:var(--cardfg);border:1px solid var(--edge);border-radius:26px;padding:26px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .2s,border-color .2s}
.pack>*{position:relative;z-index:1}

.pack:active{transform:translateY(0)}
.pack .tile{width:52px;height:52px;border-radius:15px;background:var(--ac);color:#141414;display:grid;place-items:center;margin-bottom:auto}
.pack b{font-size:2rem;letter-spacing:-.03em;margin-top:24px}
.pack>span:not(.tile):not(.art){font-weight:500;font-size:.98rem;opacity:.75;max-width:64%;line-height:1.35}

.art{position:absolute!important;z-index:0!important;right:0;top:0;bottom:0;width:62%;display:block;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent,#000 60%);mask-image:linear-gradient(to right,transparent,#000 60%)}
.art img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) brightness(.6) contrast(1.15);opacity:.5}
.packs>.pack:last-child:nth-child(odd){grid-column:1/-1}
.art svg{position:absolute;right:-28px;bottom:-34px;width:250px;height:250px;opacity:.08;stroke-width:1.2}
.art.vec svg{position:absolute;inset:0;width:100%;height:100%;opacity:1}
.art.sph::before{content:'';position:absolute;right:-34%;top:12%;width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 28% 30%,#8a8a8a,#3a3a3a 48%,#0e0e0e 78%);opacity:.6}
:root:not([data-theme=dark]) .art img{filter:grayscale(1);opacity:.22}

.si{display:block}
.foot{margin-top:30px;font-size:.78rem;opacity:.6;line-height:1.4}
.home>.foot{max-width:60ch;font-size:.78rem;margin:40px auto 0;white-space:normal}
.game{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1280px;margin:0 auto;width:100%}
.top{display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;gap:8px;padding:8px 12px 6px;font-weight:700}
.top>button{justify-self:start}
.top .ttl{display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0;text-align:center}
.top .ttl small{font-size:.72rem;font-weight:500;opacity:.6}
.top .ttl b{font-size:1.1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.top .rt{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.top button{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.top .ic{background:var(--track);color:var(--fg);font-size:1rem}
.top .sc{min-width:60px;text-align:right;font-variant-numeric:tabular-nums}
.prog{display:flex;gap:6px;padding:0 12px 6px}.prog i{flex:1;height:6px;border-radius:4px;background:var(--track);transition:background .3s}
.prog i.cur{background:var(--fg)}.prog i.ok{background:var(--ac)}.prog i.bad{background:#e5484d}
.hint{display:flex;align-items:center;justify-content:center;gap:12px;min-height:40px;padding:0 12px 8px;font-weight:700;font-size:1.05rem;text-align:center}
.hint span{line-height:1.3}
.hint u{color:inherit;text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:2.5px;text-underline-offset:5px;text-decoration-skip-ink:none}
.hint .btn{padding:7px 20px;font-size:1rem}
.stage{flex:1;margin:0 10px;border-radius:24px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--bg);position:relative;min-height:0}
.credits{padding:8px 12px calc(8px + env(safe-area-inset-bottom));text-align:center;font-size:.72rem;opacity:.6;font-weight:500;line-height:1.3}
.pn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;min-height:0;min-width:0;cursor:pointer;transition:background .35s,transform .26s,opacity .26s,filter .15s}
.pn.l,.pn.r{background:var(--card);color:var(--cardfg)}
.stage.done .pn{cursor:default}.stage:not(.done) .pn:hover{filter:brightness(1.12)}
.pn:focus-visible{outline:3px solid var(--ac);outline-offset:-10px}
.pn.good{background:var(--ac)!important;color:#141414!important}.pn.bad{background:#ef5a5f!important;color:#141414!important}
.stage.leave .pn{opacity:0;transform:translateX(-36px)}

.im.a img,.im.f img{height:100%;aspect-ratio:1;object-fit:cover;border-radius:50%}
.av{height:100%;aspect-ratio:1;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:clamp(1.6rem,6vh,3rem);font-weight:700}

.im.f img{object-position:center 20%}
.im svg{height:100%;width:auto;max-width:60%}
.name{font-size:clamp(1.3rem,3.6vw,2.3rem);font-weight:700;letter-spacing:-.03em;line-height:1.05}

.res .big{font-size:clamp(4rem,18vw,8rem);font-weight:700;letter-spacing:-.06em;line-height:.9}
.res h2{font-size:1.6rem;letter-spacing:-.03em}
.bars{width:100%;display:grid;gap:8px;text-align:left}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-weight:700;font-size:.95rem}

.acts .btn{display:inline-flex;align-items:center;gap:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .15s both}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

// builds 5 fresh pairs: never a near-tie, and 1-2 close calls mixed in with easier ones
const gapOf=(x,y,s)=>{const d=Math.abs(x.v[s.k]-y.v[s.k]),M=Math.max(x.v[s.k],y.v[s.k]);return s.ab?d:(M>0?d/M:0)};
const flip=p=>Math.random()<.5?p:[p[1],p[0]];
function pairs(pool,s){
 const mn=s.ab?s.mn:.05,cl=s.ab?s.cl:.35;let best=null,bs=99;
 if(pool.length>=10)for(let a=0;a<400&&bs>0;a++){
  const q=shuf(pool),r=[];let ok=true;
  for(let i=0;i<5;i++){const x=q[2*i],y=q[2*i+1];if(gapOf(x,y,s)<mn){ok=false;break}r.push([x,y])}
  if(!ok)continue;
  const c=r.filter(p=>gapOf(p[0],p[1],s)<=cl).length,sc=c<1?1-c:c>2?c-2:0;
  if(sc<bs){bs=sc;best=r}
 }
 if(best)return shuf(best).map(flip);
 const r=[];
 for(let t=0;r.length<5&&t<2000;t++){const x=pool[Math.random()*pool.length|0],y=pool[Math.random()*pool.length|0];if(x!==y&&x.v[s.k]!==y.v[s.k]&&(t>800||gapOf(x,y,s)>=mn)&&!r.some(p=>p.includes(x)&&p.includes(y)))r.push(flip([x,y]))}
 return r;
}

function home(){

}
